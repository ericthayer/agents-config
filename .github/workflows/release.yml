name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agents-config-release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      ref: ${{ steps.release.outputs.ref }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run prepare:packages
      - run: npm test
      - run: npm run test:packages

      - name: Install pinned release tooling
        run: npm install --global semantic-release@24.2.0 @semantic-release/changelog@6.0.3 @semantic-release/git@10.0.1

      - name: Create synchronized release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release

  publish:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
      ref: ${{ needs.release.outputs.ref }}
      commit: ${{ needs.release.outputs.commit }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

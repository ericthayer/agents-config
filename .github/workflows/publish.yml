name: Publish to npm

# Only this workflow publishes. Explicit invocation avoids GITHUB_TOKEN's
# suppression of workflows triggered by automatically created tags/releases.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      ref:
        type: string
        required: true
      commit:
        type: string
        required: true
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release version, without v (for example 1.6.0)'
        type: string
        required: true
      ref:
        description: 'Optional matching release tag (1.6.0, v1.6.0, or refs/tags/v1.6.0); defaults from version'
        type: string
        required: false
      commit:
        description: 'Optional full release commit SHA to verify against the tag'
        type: string
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Job-level concurrency covers both reusable calls and manual retries.
    concurrency:
      group: agents-config-npm-publish
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_REF: ${{ inputs.ref }}
      RELEASE_COMMIT: ${{ inputs.commit }}
    steps:
      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Invalid stable release version"
            exit 1
          fi
          case "$RELEASE_REF" in
            ""|"$RELEASE_VERSION"|"v$RELEASE_VERSION"|"refs/tags/v$RELEASE_VERSION") ;;
            *)
              echo "::error::Release ref must match the version tag"
              exit 1
              ;;
          esac
          echo "ref=refs/tags/v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "RELEASE_REF=refs/tags/v$RELEASE_VERSION" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.release-tag.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install pinned npm with trusted publishing support
        run: npm install --global npm@11.21.0

      - name: Use current publish tooling
        run: git checkout --force "$GITHUB_SHA" -- scripts/publish-packages.js

      - name: Validate tag and checkout before installing
        run: node scripts/publish-packages.js --check-ref --version "$RELEASE_VERSION" --ref "$RELEASE_REF" --commit "$RELEASE_COMMIT"

      - run: npm ci
      - run: npm run prepare:packages
      - run: npm test
      - run: npm run test:packages

      - name: Preflight all artifacts and publish in dependency order
        run: node scripts/publish-packages.js --version "$RELEASE_VERSION" --ref "$RELEASE_REF" --commit "$RELEASE_COMMIT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
